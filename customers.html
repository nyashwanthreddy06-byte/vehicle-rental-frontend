<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers - Vehicle Rental System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>🚗 Vehicle Rental</h1>
      <span class="inr-badge">🇮🇳 INR (₹)</span>
    </div>
    <nav>
      <a href="index.html"><span class="icon">📊</span> Dashboard</a>
      <a href="vehicles.html"><span class="icon">🚘</span> Vehicles</a>
      <a href="customers.html" class="active"><span class="icon">👥</span> Customers</a>
      <a href="bookings.html"><span class="icon">📋</span> Bookings</a>
    </nav>
    <div class="sidebar-footer">
      Vehicle Rental System &copy; 2026
    </div>
  </aside>

  <!-- Page Content -->
  <div class="page-wrapper">
    <header class="topbar">
      <h2>👥 Customer Management</h2>
      <div class="topbar-right">
        <span class="time-chip" id="clock">--:--:--</span>
      </div>
    </header>

    <main class="content">
      <div class="page-header">
        <h2>Registered Customers</h2>
        <button class="btn btn-primary" onclick="openAdd()">➕ Add Customer</button>
      </div>

      <!-- Add / Edit Form Card -->
      <div class="card" id="customer-form-section" style="display: none;">
        <div class="card-header" id="form-title">➕ Add New Customer</div>
        <div class="card-body">
          <div class="form-grid">
            <div class="form-group">
              <label>Full Name *</label>
              <input type="text" id="c-name" placeholder="e.g. Ramesh Patel" />
            </div>
            <div class="form-group">
              <label>Email *</label>
              <input type="email" id="c-email" placeholder="e.g. ramesh@example.com" />
            </div>
            <div class="form-group">
              <label>Mobile Number (Indian 10-digit) *</label>
              <input type="tel" id="c-phone" placeholder="e.g. 9876543210" maxlength="10" />
            </div>
            <div class="form-group">
              <label>Address</label>
              <input type="text" id="c-address" placeholder="e.g. Bangalore, Karnataka" />
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" onclick="saveCustomer()">💾 Save Customer</button>
            <button class="btn btn-warning" onclick="closeForm()">✖ Cancel</button>
          </div>
        </div>
      </div>

      <!-- Search Input -->
      <div class="card" style="margin-bottom: 16px;">
        <div class="card-body" style="padding: 16px;">
          <input type="text" id="search-input" placeholder="🔍 Search by customer name, email or phone..." oninput="filterCustomers()" />
        </div>
      </div>

      <!-- Customers Table -->
      <div class="card">
        <div class="card-body table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="customers-tbody">
              <tr><td colspan="6" class="state-msg"><div class="loading-spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/customers.js"></script>
</body>
</html>
